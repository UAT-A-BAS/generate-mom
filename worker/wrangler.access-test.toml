name = "generate-mom-collab-worker-entra-test"
main = "index.mjs"
compatibility_date = "2026-05-21"

[vars]
REQUIRE_ENTRA = "true"
ENTRA_TENANT_ID = "REPLACE_WITH_ENTRA_TENANT_ID"
ENTRA_CLIENT_ID = "REPLACE_WITH_ENTRA_CLIENT_ID"

[[durable_objects.bindings]]
name = "MOM_COLLAB_SESSIONS"
class_name = "MomCollabSession"

[[migrations]]
tag = "entra-test-v1"
new_sqlite_classes = ["MomCollabSession"]

[[r2_buckets]]
binding = "MOM_COLLAB_AUDIT"
bucket_name = "generate-mom-collab-audit-entra-test"
